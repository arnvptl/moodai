name: MoodAI

on:
  # Start it by hand when a lab begins: Actions tab -> MoodAI -> Run workflow
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep polling, in minutes (max ~330)"
        default: "150"

  # Optional: auto-start at lab time. Cron is in UTC; IST = UTC + 5:30.
  # Example: every Tuesday at 09:55 IST (04:25 UTC) for the default 150 minutes.
  # schedule:
  #   - cron: "25 4 * * 2"

# Never run two copies at once, or they would answer the same question twice.
concurrency:
  group: moodai
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Needs a real JDK (javac). Match JAVA_RELEASE below to your lab's JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: pip install -r requirements.txt

      # Lets the agent start Swing programs on a virtual display to catch crashes.
      - name: Virtual display for GUI checks
        run: which xvfb-run || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)

      - name: Check Moodle is reachable from GitHub's network
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 http://103.117.208.18/moodle/login/index.php || true)
          echo "Moodle login page: HTTP ${code}"
          if [ "$code" != "200" ] && [ "$code" != "303" ] && [ "$code" != "302" ]; then
            echo "::error::Moodle is not reachable from GitHub-hosted runners (college firewall?). Use a self-hosted runner instead."
            exit 1
          fi

      - name: Run MoodAI
        env:
          PYTHONUNBUFFERED: "1"
          MOODLE_USERNAME: ${{ secrets.MOODLE_USERNAME }}
          MOODLE_PASSWORD: ${{ secrets.MOODLE_PASSWORD }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JAVA_RELEASE: "17"
          NB_TEMPLATE_DIR: nb_template   # optional: nbproject/ folder copied from your own NetBeans
          MAX_RUNTIME_MIN: ${{ inputs.minutes || '150' }}
        run: python moodai/auto.py